# Render Blueprint for the V Agency API (Express + PostgreSQL).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once in the dashboard.
# The web app is deployed separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: v-agency-api
    runtime: node
    rootDir: backend
    # The free plan sleeps when idle, which pauses the deadline-alert and calendar-sync jobs.
    # Starter (or higher) keeps them running.
    plan: starter
    region: oregon
    buildCommand: npm ci
    # Migrations run on every start. The seed is idempotent: it creates the master statuses,
    # the default services and the first admin only when they do not exist yet.
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ENABLE_JOBS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Neon connection string, e.g. postgresql://…neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Your Vercel URL, e.g. https://v-agency.vercel.app (email links and the Google sign-in redirect)
      - key: APP_URL
        sync: false
      # Only needed if the frontend calls this API directly (VITE_API_URL) instead of through the Vercel /api proxy.
      - key: CORS_ORIGIN
        sync: false

      # First admin account, created on the first start.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Set to "true" for one deploy to reset ADMIN_EMAIL's password to ADMIN_PASSWORD (creates the admin if missing),
      # then delete it again.
      - key: ADMIN_RESET
        value: "false"

      # Email (deadline alerts, approvals, requirements). Leave empty to log emails instead of sending.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # Google Drive (file manager and requirement uploads)
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHARED_DRIVE_ID
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false

      # Google Calendar sync. Redirect URI: https://<vercel-domain>/api/calendar/oauth/callback
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
